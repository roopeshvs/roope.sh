<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 620 230" width="620" height="230" font-family="Arial, Helvetica, sans-serif">
  <title>Torn page after power loss</title>
  <desc>A 16 KiB InnoDB page broken across four 4 KiB sectors. Power loss partway through writing leaves two new sectors and two old sectors. That is a torn page.</desc>
  <text x="90" y="28" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">Before write</text>
  <rect x="30" y="48" width="120" height="38" rx="3" fill="none" stroke="#737373" stroke-width="1.5"/>
  <rect x="30" y="86" width="120" height="38" rx="3" fill="none" stroke="#737373" stroke-width="1.5"/>
  <rect x="30" y="124" width="120" height="38" rx="3" fill="none" stroke="#737373" stroke-width="1.5"/>
  <rect x="30" y="162" width="120" height="38" rx="3" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="90" y="72" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">old · 4 KiB</text>
  <text x="90" y="110" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">old · 4 KiB</text>
  <text x="90" y="148" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">old · 4 KiB</text>
  <text x="90" y="186" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">old · 4 KiB</text>
  <text x="90" y="225" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">16 KiB page</text>
  <line x1="180" y1="125" x2="240" y2="125" stroke="#737373" stroke-width="1.5"/>
  <polygon points="240,119 250,125 240,131" fill="#737373"/>
  <text x="215" y="115" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">write…</text>
  <text x="215" y="190" fill="#ea580c" font-size="22" text-anchor="middle">⚡</text>
  <text x="215" y="225" fill="#ea580c" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" text-anchor="middle">power loss</text>
  <text x="430" y="28" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">After power loss</text>
  <rect x="370" y="48" width="120" height="38" rx="3" fill="#737373" fill-opacity="0.15" stroke="#737373" stroke-width="1.5"/>
  <rect x="370" y="86" width="120" height="38" rx="3" fill="#737373" fill-opacity="0.15" stroke="#737373" stroke-width="1.5"/>
  <rect x="370" y="124" width="120" height="38" rx="3" fill="none" stroke="#737373" stroke-width="1.5"/>
  <rect x="370" y="162" width="120" height="38" rx="3" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="430" y="72" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">new · 4 KiB</text>
  <text x="430" y="110" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">new · 4 KiB</text>
  <text x="430" y="148" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">old · 4 KiB</text>
  <text x="430" y="186" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">old · 4 KiB</text>
  <text x="430" y="225" fill="#ea580c" font-size="13" font-weight="600" text-anchor="middle">torn page</text>
</svg>
