<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 720 170" width="720" height="170" font-family="Arial, Helvetica, sans-serif">
  <title>RDS Optimized Writes path</title>
  <desc>A dirty page in the buffer pool is written directly to its final tablespace location in a single atomic 16 KiB write, made possible by the AWS Nitro System.</desc>
  <rect x="20" y="60" width="170" height="80" rx="6" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="105" y="95" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">Dirty page</text>
  <text x="105" y="115" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">(buffer pool)</text>
  <line x1="200" y1="100" x2="540" y2="100" stroke="#737373" stroke-width="1.5"/>
  <polygon points="540,94 550,100 540,106" fill="#737373"/>
  <text x="370" y="55" fill="#ea580c" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" text-anchor="middle">AWS Nitro guarantees atomicity</text>
  <text x="370" y="90" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">atomic 16 KiB write</text>
  <text x="370" y="120" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">+ fsync</text>
  <rect x="560" y="60" width="140" height="80" rx="6" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="630" y="95" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">Tablespace</text>
  <text x="630" y="115" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">(final location)</text>
  <text x="360" y="190" fill="#737373" font-size="13" font-style="italic" text-anchor="middle" opacity="0.9">Every dirty page is written once.</text>
</svg>
