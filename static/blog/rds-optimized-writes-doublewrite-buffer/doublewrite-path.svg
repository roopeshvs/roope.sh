<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 50 720 155" width="720" height="155" font-family="Arial, Helvetica, sans-serif">
  <title>MySQL write path with the doublewrite buffer</title>
  <desc>A dirty page in the buffer pool is written to the doublewrite area and fsynced, then written to its tablespace location and fsynced again. Every dirty page becomes two physical writes.</desc>
  <rect x="20" y="60" width="170" height="80" rx="6" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="105" y="95" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">Dirty page</text>
  <text x="105" y="115" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">(buffer pool)</text>
  <line x1="200" y1="100" x2="270" y2="100" stroke="#737373" stroke-width="1.5"/>
  <polygon points="270,94 280,100 270,106" fill="#737373"/>
  <text x="240" y="90" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">write</text>
  <text x="240" y="120" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">+ fsync</text>
  <rect x="290" y="60" width="170" height="80" rx="6" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="375" y="95" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">Doublewrite</text>
  <text x="375" y="115" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">area</text>
  <line x1="470" y1="100" x2="540" y2="100" stroke="#737373" stroke-width="1.5"/>
  <polygon points="540,94 550,100 540,106" fill="#737373"/>
  <text x="510" y="90" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">write</text>
  <text x="510" y="120" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">+ fsync</text>
  <rect x="560" y="60" width="140" height="80" rx="6" fill="none" stroke="#737373" stroke-width="1.5"/>
  <text x="630" y="95" fill="#737373" font-size="13" font-weight="600" text-anchor="middle">Tablespace</text>
  <text x="630" y="115" fill="#737373" font-family="Menlo, Consolas, Courier New, monospace" font-size="11" opacity="0.8" text-anchor="middle">(final location)</text>
  <text x="360" y="190" fill="#737373" font-size="13" font-style="italic" text-anchor="middle" opacity="0.9">Every dirty page is written twice.</text>
</svg>
