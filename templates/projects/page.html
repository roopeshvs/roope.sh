{% extends "base.html" %}

{% block content %}
<p><a href="/projects/">&larr; Back to projects</a></p>

<h1>{{ page.title }}</h1>
{{<post.meta page={page} />}}

<p class="hstack gap-4">
  {%- if page.extra.repoURL %}<a href="{{ page.extra.repoURL }}">Repository</a>{% endif %}

</p>

<article>
  {{ page.content | safe }}
</article>
{% endblock content %}
